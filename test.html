<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section class="glass-cube"></section>

    <div class="background">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .background {
            width: 100vw;
            height: 100vh;
            background: #ffeee3;
            position: relative;
        }

        .background span {
            width: 20vmin;
            height: 20vmin;
            border-radius: 20vmin;
            backface-visibility: hidden;
            position: absolute;
            animation-name: move;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes move {
            100% {
                transform: translate3d(0, 0, 1px) rotate(360deg);
            }
        }
    </style>

    <script>
        const colors = ['#F7BA2C', '#F08344', '#E9295C'];
        const spans = document.querySelectorAll('.background span');
        const particleSize = 20; // vmin
        const baseDuration = 6; // s

        spans.forEach(span => {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const top = Math.random() * 100;
            const left = Math.random() * 100;
            const duration = (Math.random() * baseDuration + 10).toFixed(1); // 10s + random 0-6s
            const delay = -(Math.random() * (baseDuration + 10)).toFixed(1); // -1*(0-16s)
            const originX = (Math.random() * 50 - 25).toFixed(1);
            const originY = (Math.random() * 50 - 25).toFixed(1);
            const blurRadius = ((Math.random() + 0.5) * particleSize * 0.5).toFixed(1);
            const x = Math.random() > 0.5 ? -1 : 1;
            const boxShadowX = particleSize * 2 * x;

            span.style.color = color;
            span.style.top = `${top}%`;
            span.style.left = `${left}%`;
            span.style.animationDuration = `${duration}s`;
            span.style.animationDelay = `${delay}s`;
            span.style.transformOrigin = `${originX}vw ${originY}vh`;
            span.style.boxShadow = `${boxShadowX}vmin 0 ${blurRadius}vmin currentColor`;
        });
    </script>

</body>

</html>
